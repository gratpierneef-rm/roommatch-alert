name: Kamer-alert (ROOM, Pararius, Kamernet)

on:
  schedule:
    - cron: "*/10 * * * *"   # elke 10 minuten (GitHub kan soms wat vertraging hebben)
  workflow_dispatch:          # handmatig starten via de Actions-tab

permissions:
  contents: write

concurrency:
  group: room-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Check alle sites
        env:
          EMAIL_FROM: ${{ secrets.GMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.GMAIL_ADDRESS }}
        run: python kamer_alert.py

      - name: Bewaar welke kamers al gezien zijn
        run: |
          git config user.name "room-bot"
          git config user.email "room-bot@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "update seen" && git push)
